// maestro_pw settings model: WriteSetting / ReadSetting / SubscribeToSettingsChanges.
// Reverse-engineered for interoperability with Google Pixel Buds (EU Directive 2009/24/EC art. 6).
//
// Field numbers and wire types are the wire format; names are ours. Tags:
//   [confirmed]                    the companion app uses it this way
//   [confirmed on hardware: ...]   observed on real buds
//   [inferred ...]                 reasoned from indirect evidence; treat as a hypothesis
//
// KEY FACT (confirmed): the "setting ID" enum value used in ReadSettingRequest equals the oneof
// field number of the setting inside its group message. The app validates IDs against exactly
// those field numbers, keys pending writes by them, and reads a setting back by its field number.
//
// Model families (group message <-> product). The app picks the group by device type
// [confirmed]: 1 -> PrestoSetting, 2 -> StrettoSetting, 4, 5, 6, 9 -> AllegroSetting.
//   CommonSetting   all models
//   PrestoSetting   Pixel Buds 2020 ("presto")
//   StrettoSetting  Pixel Buds A-Series ("stretto"; the usual codename)
//   AllegroSetting  Pixel Buds Pro ("allegro"), Pro 2 ("largo"), ag12/ag22
//   TransientState  non-persistent runtime states
//
// Transport note (confirmed): the same SettingValue and ReadSettingRequest messages are also sent
// over the legacy RFCOMM protocol, in legacy frame group 0x87 (135): code 9 = write SettingValue,
// code 8 = ReadSettingRequest; settings come back as code 10 = SettingValue. Presto uses
// SettingValue.f2 / ReadSettingRequest.f2 (IDs 1..12); Stretto f3 (IDs 1,3,5,7,8,10..14).

syntax = "proto2";

package maestro_pw;

// ---------------------------------------------------------------------------
// Top level
// ---------------------------------------------------------------------------

// WriteSetting request, ReadSetting response and SubscribeToSettingsChanges stream item share
// this layout. [confirmed] Exactly one setting is carried per message: the group oneof below has
// one member set.
message SettingValue {
  oneof group {
    CommonSetting common = 1;
    PrestoSetting presto = 2;
    StrettoSetting stretto = 3;
    AllegroSetting allegro = 4;
    TransientState transient_state = 5;
  }
}

// ReadSetting request. [confirmed]
// The enum value names the setting = the oneof field number in the group.
// For transient states the request carries a TransientState "template": set the oneof member you
// want to read to any value (the app uses false/0), e.g. to read sleep mode:
// transient_state { sleep_mode_active: false } [confirmed].
message ReadSettingRequest {
  oneof setting_id {
    CommonSettingId common = 1;        // only value 1 is valid [confirmed]
    PrestoSettingId presto = 2;        // 1..12 [confirmed]
    StrettoSettingId stretto = 3;      // 0,1,3,5,7,8,10..14 [confirmed]
    AllegroSettingId allegro = 4;      // 0..39 [confirmed]
    TransientState transient_state = 5; // template (see above)
  }
}

// Setting IDs. Value == field number in the corresponding group message.
enum CommonSettingId {
  COMMON_SETTING_OOBE_MODE = 1;
}

enum PrestoSettingId {
  PRESTO_SETTING_ON_HEAD_DETECTION = 1;
  PRESTO_SETTING_CONTENT_IQ = 2;
  PRESTO_SETTING_UNKNOWN_3 = 3;
  PRESTO_SETTING_TOUCH_CONTROLS = 4;
  PRESTO_SETTING_ADAPTIVE_SOUND = 5;
  PRESTO_SETTING_SHARED_MODE = 6;
  PRESTO_SETTING_UNKNOWN_7 = 7;
  PRESTO_SETTING_OOBE_FINISHED = 8;
  PRESTO_SETTING_ATTENTION_ALERTS = 9;
  PRESTO_SETTING_DIAGNOSTICS = 10;
  PRESTO_SETTING_GESTURES_ENABLED = 11;
  PRESTO_SETTING_EQ = 12;
}

enum StrettoSettingId {
  STRETTO_SETTING_UNSPECIFIED = 0;
  STRETTO_SETTING_ON_HEAD_DETECTION = 1;
  STRETTO_SETTING_UNKNOWN_3 = 3;
  STRETTO_SETTING_ADAPTIVE_SOUND = 5;
  STRETTO_SETTING_UNKNOWN_7 = 7;
  STRETTO_SETTING_OOBE_FINISHED = 8;
  STRETTO_SETTING_DIAGNOSTICS = 10;
  STRETTO_SETTING_GESTURES_ENABLED = 11;
  STRETTO_SETTING_EQ = 12;
  STRETTO_SETTING_LOUDNESS_COMPENSATION = 13;
  STRETTO_SETTING_BASS_BOOST_LEVEL = 14;
}

enum AllegroSettingId {
  ALLEGRO_SETTING_UNSPECIFIED = 0;
  ALLEGRO_SETTING_UNKNOWN_1 = 1;
  ALLEGRO_SETTING_ON_HEAD_DETECTION = 2;
  ALLEGRO_SETTING_OOBE_FINISHED = 3;
  ALLEGRO_SETTING_GESTURES_ENABLED = 4;
  ALLEGRO_SETTING_DIAGNOSTICS = 5;
  ALLEGRO_SETTING_OOBE_MODE = 6;
  ALLEGRO_SETTING_TOUCH_AND_HOLD = 7;
  ALLEGRO_SETTING_UNKNOWN_8 = 8;
  ALLEGRO_SETTING_UNKNOWN_ANC_9 = 9;
  ALLEGRO_SETTING_UNKNOWN_ANC_10 = 10;
  ALLEGRO_SETTING_MULTIPOINT = 11;
  ALLEGRO_SETTING_ANC_GESTURE_LOOP = 12;
  ALLEGRO_SETTING_ANC_STATE = 13;
  ALLEGRO_SETTING_FIT_TEST_MODE = 14;
  ALLEGRO_SETTING_VOLUME_EQ = 15;
  ALLEGRO_SETTING_USER_EQ = 16;
  ALLEGRO_SETTING_VOLUME_BALANCE = 17;
  ALLEGRO_SETTING_LAST_SAVED_USER_EQ = 18;
  ALLEGRO_SETTING_SUM_TO_MONO = 19;
  ALLEGRO_SETTING_UNKNOWN_20 = 20;
  ALLEGRO_SETTING_HEARING_WELLNESS_NOTIFICATIONS = 21;
  ALLEGRO_SETTING_CONVERSATION_DETECTION = 22;
  ALLEGRO_SETTING_UNKNOWN_23 = 23;
  ALLEGRO_SETTING_UNKNOWN_24 = 24;
  ALLEGRO_SETTING_UNKNOWN_25 = 25;
  ALLEGRO_SETTING_UNKNOWN_26 = 26;
  ALLEGRO_SETTING_CASE_SOUNDS = 27;
  ALLEGRO_SETTING_BUD_RETURN_SOUND = 28;
  ALLEGRO_SETTING_HEAD_GESTURES = 29;
  ALLEGRO_SETTING_UNKNOWN_30 = 30;
  ALLEGRO_SETTING_UNKNOWN_31 = 31;
  ALLEGRO_SETTING_UNKNOWN_32 = 32;
  ALLEGRO_SETTING_UNKNOWN_33 = 33;
  ALLEGRO_SETTING_PHONE_BOOTH = 34;
  ALLEGRO_SETTING_UNKNOWN_35 = 35;
  ALLEGRO_SETTING_SLEEP_MODE_FEATURE = 36;
  ALLEGRO_SETTING_LIVE_TRANSLATE_SETTINGS = 37;
  ALLEGRO_SETTING_MIC_MUTE_FEATURE = 38;
  ALLEGRO_SETTING_UNKNOWN_39 = 39;
}

// ---------------------------------------------------------------------------
// Group messages
// ---------------------------------------------------------------------------

// [confirmed]
message CommonSetting {
  oneof value {
    // OOBE ("out of box experience") mode. The app writes true at the start of setup, false at
    // the end. [confirmed]
    bool oobe_mode = 1;
  }
}

// Pixel Buds 2020 ("presto"), legacy RFCOMM transport.
message PrestoSetting {
  oneof value {
    bool on_head_detection = 1;       // [confirmed]
    bool content_iq = 2;              // read-only from the app's view [confirmed]
    bool unknown_3 = 3;               // not handled by the app
    PrestoTouchControls touch_controls = 4; // [confirmed]
    bool adaptive_sound = 5;          // "noise IQ"; UI title "Adaptive Sound" [confirmed]
    bool shared_mode = 6;             // on-head detection shared mode [confirmed]
    bool unknown_7 = 7;               // ignored by the app
    bool oobe_finished = 8;           // [confirmed]
    AttentionAlerts attention_alerts = 9; // [confirmed]
    bool diagnostics = 10;            // usage & diagnostics upload [confirmed]
    bool gestures_enabled = 11;       // touch controls master switch [confirmed]
    EqSetting eq = 12;                // [confirmed]
  }
}

// Pixel Buds A-Series ("stretto"), legacy RFCOMM transport.
message StrettoSetting {
  oneof value {
    bool on_head_detection = 1;       // [confirmed]
    bool unknown_3 = 3;               // not handled
    bool adaptive_sound = 5;          // "noise IQ" [confirmed]
    bool unknown_7 = 7;               // not handled
    bool oobe_finished = 8;           // [confirmed]
    bool diagnostics = 10;            // [confirmed]
    bool gestures_enabled = 11;       // [confirmed]
    EqSetting eq = 12;                // bass boost on/off [confirmed]
    bool loudness_compensation = 13;  // [confirmed]
    int32 bass_boost_level = 14;      // "bass boost index" slider [confirmed]; range unknown
  }
}

// Pixel Buds Pro family ("allegro"), Pigweed maestro_pw transport.
// The app's initial sync reads every id 1..39 except 6, 8, 9, 10, 14, 20, 33.
//
// ReadSetting on Pixel Buds Pro fw 575 [confirmed on hardware: Pro fw 575]:
//   OK + value ............ 1-7, 11-19, 21-24, 26
//   UNKNOWN(2) + the oneof member set to its default (placeholder, not a value) ... 8, 9, 10, 20, 25
//   UNKNOWN(2) + empty AllegroSetting (field not known to the firmware) ........... 27-39 (and 40-48)
// Always check the RPC status: a placeholder decodes like a real false / 0.
message AllegroSetting {
  oneof value {
    bool unknown_1 = 1;               // read at sync, never handled by the app; fw 575: OK, true
    bool on_head_detection = 2;       // [confirmed]
    bool oobe_finished = 3;           // [confirmed]
    bool gestures_enabled = 4;        // touch controls master switch [confirmed]
    bool diagnostics = 5;             // [confirmed]
    bool oobe_mode = 6;               // write-only from the app [confirmed]
    TouchAndHold touch_and_hold = 7;  // per-bud press-and-hold action [confirmed]
    bool unknown_8 = 8;               // never used by the app; fw 575: UNKNOWN(2) placeholder
    AncState unknown_anc_9 = 9;       // ANC-state typed; never used by the app, not read at sync
    AncState unknown_anc_10 = 10;     // same as 9; fw 575: 9 and 10 both UNKNOWN(2) placeholders
    bool multipoint = 11;             // false = off [confirmed] [confirmed on hardware: Pro fw 575]
    AncGestureLoop anc_gesture_loop = 12; // modes cycled by the ANC press-and-hold gesture [confirmed]
    AncState anc_state = 13;          // current noise-control mode [confirmed]
    bool fit_test_mode = 14;          // true while the eartip fit test runs [inferred]
    bool volume_eq = 15;              // "Volume EQ: enhances bass and treble at low volume" [confirmed]
    UserEq user_eq = 16;              // current 5-band EQ [confirmed]
    sint32 volume_balance = 17;       // -100..100 [confirmed]
    UserEq last_saved_user_eq = 18;   // custom preset stored on the buds [confirmed]
    bool sum_to_mono = 19;            // [confirmed]
    bool unknown_20 = 20;             // never used by the app; fw 575: UNKNOWN(2) placeholder
    bool hearing_wellness_notifications = 21; // dosimeter notifications [confirmed]
    bool conversation_detection = 22; // "speech detection" [confirmed]
    Unknown23 unknown_23 = 23;        // stored as opaque bytes by the app; fw 575: OK, {f1: 0}
    TriState unknown_24 = 24;         // 0..2; never used by the app; fw 575: OK, 0
    bool unknown_25 = 25;             // never used by the app; fw 575: UNKNOWN(2) placeholder
    TriState unknown_26 = 26;         // 0..2; never used by the app; fw 575: OK, 0
    bool case_sounds = 27;            // case earcon ("all other case sounds") [confirmed]
    bool bud_return_sound = 28;       // sound when a bud is returned to the case [confirmed]
    TriState head_gestures = 29;      // 1 = disabled, 2 = enabled [confirmed]
    bool unknown_30 = 30;             // never used by the app
    Empty31 unknown_31 = 31;          // never used by the app
    bool unknown_32 = 32;             // written from an Android Settings device-details switch; meaning not resolved
    bool unknown_33 = 33;             // explicitly skipped at sync
    bool phone_booth = 34;            // PhoneBooth, legacy persistent control mode [confirmed]
    Empty35 unknown_35 = 35;          // never used by the app
    bool sleep_mode_feature = 36;     // "Pixel Watch bedtime / sleep sync" feature enable [confirmed]
    LiveTranslateSettings live_translate_settings = 37; // [confirmed]
    bool mic_mute_feature = 38;       // call mute toggle from the buds enabled [confirmed]
    bool unknown_39 = 39;             // never used by the app
  }
}

// Transient (non-persisted) states. [confirmed]
// Pro fw 575 answers ReadSetting{transient_state{sleep_mode_active: false}} with UNKNOWN(2) and an
// empty SettingValue [confirmed on hardware: Pro fw 575]: no transient reads on that firmware.
message TransientState {
  oneof value {
    LiveTranslateState live_translate_state = 1; // [confirmed]
    bool sleep_mode_active = 2;       // buds currently in bedtime mode [confirmed]
    MicMuteState mic_mute = 3;        // [confirmed]
    PhoneboothMode phone_booth_mode = 4; // [confirmed]
  }
}

// ---------------------------------------------------------------------------
// Sub-messages
// ---------------------------------------------------------------------------

// [confirmed]
message TouchAndHold {
  optional TouchSlot left = 1;
  optional TouchSlot right = 2;
}

// Only field 4 is known; fields 1-3 unknown.
message TouchSlot {
  optional TouchActionTarget hold_action = 4; // [confirmed]
}

// Either a built-in action enum or a "custom action" byte string. [confirmed]
message TouchActionTarget {
  optional TouchAction action = 1;    // 0..8
  // Custom action: sequence of (type_byte, value_byte) pairs, NUL-terminated, max 8 bytes.
  // type 1 values: 1 = Translate, 2 = Duo, 4 = Start playlist. Example: 01 01 00. [confirmed]
  optional bytes custom = 2;
}

// Values for TouchActionTarget.action. The app uses 1, 2, 3, 5, 6 and 7; values 0, 4, 8 are
// valid on the wire but unused by the app.
enum TouchAction {
  TOUCH_ACTION_UNSPECIFIED = 0;
  TOUCH_ACTION_CHECK_NOTIFICATIONS = 1;
  TOUCH_ACTION_PREVIOUS_TRACK_REPEAT = 2;
  TOUCH_ACTION_NEXT_TRACK = 3;
  TOUCH_ACTION_UNKNOWN_4 = 4;
  TOUCH_ACTION_TOGGLE_ANC = 5;
  TOUCH_ACTION_ASSISTANT = 6;
  TOUCH_ACTION_LIVE_TRANSLATE = 7;
  TOUCH_ACTION_UNKNOWN_8 = 8;
}

// Presto. [confirmed]
message PrestoTouchControls {
  optional PrestoBudGestures left = 1;  // [inferred: same left/right order as TouchAndHold]
  optional PrestoBudGestures right = 2;
}

// Two configurable gesture slots per bud. App default when absent: slot1 = CHECK_NOTIFICATIONS,
// slot2 = NONE. [inferred: slot1 = touch & hold action, slot2 = secondary action]
message PrestoBudGestures {
  optional TouchActionTarget slot1 = 1;
  optional TouchActionTarget slot2 = 2;
}

// Which modes the ANC press-and-hold gesture cycles through. [confirmed]
// Pro fw 575 reports {active: true, off: false, aware: true} with f4 absent, and the left-bud
// long-press (TOGGLE_ANC) then alternates only ACTIVE <-> AWARE [confirmed on hardware: Pro fw 575].
message AncGestureLoop {
  optional bool active = 1;       // ANC on
  optional bool off = 2;
  optional bool aware = 3;        // transparency
  optional bool adaptive = 4;
}

// 5-band user EQ, gain per band (float, dB [inferred]). The app's UI defaults to a range of
// -6..+6 in steps of 0.5. Field order confirmed.
message UserEq {
  optional float low_bass = 1;
  optional float bass = 2;
  optional float mid = 3;
  optional float treble = 4;
  optional float upper_treble = 5;
}

// Presto "attention alerts". [confirmed]
message AttentionAlerts {
  optional bool enabled = 1;        // master; the app writes false alone to disable
  optional bool baby_crying = 2;
  optional bool dog_barking = 3;
  optional bool emergency_siren = 4;
}

// [confirmed]
message LiveTranslateSettings {
  // "Switch to noise cancellation automatically when conversation mode is active"
  optional bool auto_anc = 1;
}

// [confirmed]
message LiveTranslateState {
  optional LiveTranslateStatus status = 1;
  optional LiveTranslateConfig config = 2;
  optional LiveTranslateChangeReason change_reason = 3;
}

message LiveTranslateConfig {
  // 0 unknown, 1 passive ("listening mode"), 2 conversational [confirmed]
  optional int32 mode = 1;                    // 0..2
  optional int32 unknown_2 = 2;               // 0..3; set from the Translate app's state
}

// [confirmed]
message MicMuteState {
  optional bool unknown_1 = 1;      // [inferred: call active / feature flag]
  optional bool muted = 2;          // telecom call-mute state
  optional MicMuteChangeReason reason = 3;
}

// No fields known from the app. On the wire a varint field 1 exists: Pro fw 575 answers
// ReadSetting(23) with {f1: 0} [confirmed on hardware: Pro fw 575]. Type of f1 (bool / enum / int)
// and meaning unknown.
message Unknown23 {
  optional int32 f1 = 1;
}

// No fields known.
message Empty31 {}
message Empty35 {}

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// [confirmed]
enum AncState {
  ANC_STATE_UNKNOWN = 0;
  ANC_STATE_OFF = 1;
  ANC_STATE_ACTIVE = 2;   // noise cancellation
  ANC_STATE_AWARE = 3;    // transparency
  ANC_STATE_ADAPTIVE = 4;
}

// The bass boost switch writes BASS_BOOST when on, NORMAL when off. [confirmed]
enum EqSetting {
  EQ_SETTING_NORMAL = 0;
  EQ_SETTING_BASS_BOOST = 1;
  EQ_SETTING_UNKNOWN_2 = 2;  // valid on the wire, mapped to "unknown" by the app
}

// Tri-state used by AllegroSetting 24/26/29 (all 0..2). Names from head_gestures
// (enabled -> 2, disabled -> 1).
enum TriState {
  TRI_STATE_UNKNOWN = 0;
  TRI_STATE_DISABLED = 1;
  TRI_STATE_ENABLED = 2;
}

// PhoneBooth: an in-call mode driven by the phone's dialer. With *_WITH_HEARTBEAT the host must
// keep sending PHONEBOOTH_MODE_HEARTBEAT (the app's default period is 3000 ms) or the buds drop
// the mode. [confirmed]
enum PhoneboothMode {
  PHONEBOOTH_MODE_UNKNOWN = 0;
  PHONEBOOTH_MODE_ENABLE = 1;
  PHONEBOOTH_MODE_ENABLE_WITH_HEARTBEAT = 2;
  PHONEBOOTH_MODE_DISABLE = 3;
  PHONEBOOTH_MODE_HEARTBEAT = 4;
}

enum LiveTranslateStatus {
  LIVE_TRANSLATE_STATUS_UNKNOWN = 0;
  LIVE_TRANSLATE_STATUS_INACTIVE = 1;
  LIVE_TRANSLATE_STATUS_START_PENDING = 2;
  LIVE_TRANSLATE_STATUS_PAUSED = 3;
  LIVE_TRANSLATE_STATUS_RUNNING = 4;
}

enum LiveTranslateChangeReason {
  LIVE_TRANSLATE_CHANGE_REASON_UNKNOWN = 0;
  LIVE_TRANSLATE_CHANGE_REASON_APP = 1;
  LIVE_TRANSLATE_CHANGE_REASON_GESTURE = 2;
  LIVE_TRANSLATE_CHANGE_REASON_OHD = 3;
  LIVE_TRANSLATE_CHANGE_REASON_WATCHDOG_TIMEOUT = 4;
  LIVE_TRANSLATE_CHANGE_REASON_BT_DISCONNECTED = 5;
  LIVE_TRANSLATE_CHANGE_REASON_GEMINI = 6;
}

enum MicMuteChangeReason {
  MIC_MUTE_CHANGE_REASON_UNKNOWN = 0;
  MIC_MUTE_CHANGE_REASON_APP = 1;
  MIC_MUTE_CHANGE_REASON_GESTURE = 2;
  MIC_MUTE_CHANGE_REASON_OHD = 3;
}
