[package]
name = "kbudsctl"
description = "Command-line client for the kbuds Pixel Buds daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Proxies are generated from dbus/*.xml at build time.
zbus_xmlgen = { version = "5.4", default-features = false }
zbus_xml = "5"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
