#
# kbuds: suspend the Pixel Buds' A2DP sink 1 s after playback stops.
#
# With multipoint, the buds hand the audio to the other host (e.g. a phone) only
# once PipeWire suspends the A2DP stream. With the default idle timeout the
# phone waits ~10-15 s after a pause on the PC; with 1 s it takes ~3 s and the
# first press works. Cost: the next sound restarts A2DP and can clip very short
# sounds.
#
# The match uses the node description, i.e. the Bluetooth alias. If you renamed
# your buds, copy this file to ~/.config/wireplumber/wireplumber.conf.d/ and
# adjust the pattern (or use api.bluez5.address = "AA:BB:CC:DD:EE:FF").
# Restart WirePlumber and reconnect the buds for it to apply.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
        node.description = "~.*Pixel Buds.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 1
      }
    }
  }
]
